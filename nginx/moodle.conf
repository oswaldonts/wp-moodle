server {
    listen 80;
    server_name _;

    location / {
        proxy_pass         http://moodle-app;
        proxy_set_header   Host localhost:8091;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect     off;
        proxy_read_timeout 300;
    }
}
